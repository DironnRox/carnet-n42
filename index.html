<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Prontera Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --fond: #f4f2ee; --surface: #ffffff; --surface-2: #faf9f6; --texte: #1c1b19; --doux: #6e6a63; --tres-doux: #a19c93;
  --ligne: #e6e2da; --accent: #c2622d; --accent-fond: #fbeee5; --vert: #2d7a4f; --vert-fond: #e5f3ea;
  --rouge: #b03a3a; --rouge-fond: #f8e6e6; --bleu: #2c5b96; --bleu-fond: #e6eef8; --or: #a57a12; --or-fond: #f7efd9;
  --ombre: 0 1px 2px rgba(30, 25, 15, .05), 0 4px 16px rgba(30, 25, 15, .05); --rayon: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #121214; --surface: #1b1b1f; --surface-2: #222227; --texte: #ecebe8; --doux: #a3a19b; --tres-doux: #6f6d68;
    --ligne: #2e2e34; --accent: #e88a55; --accent-fond: #3a2519; --vert: #6cc48f; --vert-fond: #1c3326;
    --rouge: #e47b7b; --rouge-fond: #3b2020; --bleu: #84aee6; --bleu-fond: #1d2a3d; --or: #e0b54d; --or-fond: #352b14;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --fond: #121214; --surface: #1b1b1f; --surface-2: #222227; --texte: #ecebe8; --doux: #a3a19b; --tres-doux: #6f6d68;
  --ligne: #2e2e34; --accent: #e88a55; --accent-fond: #3a2519; --vert: #6cc48f; --vert-fond: #1c3326;
  --rouge: #e47b7b; --rouge-fond: #3b2020; --bleu: #84aee6; --bleu-fond: #1d2a3d; --or: #e0b54d; --or-fond: #352b14;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte); }
body { font: 14.5px/1.5 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.page { max-width: 1240px; margin: 0 auto; padding: 0 16px 80px; }

/* ---- en-tete ---- */
header { padding: 28px 0 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.marque h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.marque h1 span { color: var(--accent); }
.marque p { margin: 4px 0 0; color: var(--doux); font-size: 13.5px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px; padding: 8px 14px; box-shadow: var(--ombre); }
.stat b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat small { color: var(--doux); font-size: 12px; }

/* ---- onglets ---- */
nav { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 11px; padding: 3px; box-shadow: var(--ombre); margin-bottom: 18px; max-width: 100%; overflow-x: auto; }
nav button { border: 0; background: none; padding: 8px 16px; border-radius: 8px; color: var(--doux); font-weight: 500; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--texte); }
nav button.actif { background: var(--accent); color: #fff; }
.panneau { display: none; } .panneau.actif { display: block; }

/* ---- champs ---- */
input, select { font: inherit; color: var(--texte); background: var(--surface); border: 1px solid var(--ligne); border-radius: 9px; padding: 9px 12px; min-width: 0; outline: none; transition: border-color .15s; }
input:focus, select:focus { border-color: var(--accent); }
input[type=number] { width: 84px; }
.champ-recherche { position: relative; flex: 1; min-width: 220px; }
.champ-recherche input { width: 100%; padding-left: 36px; }
.champ-recherche svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tres-doux); }
.barre { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.bouton { border: 0; background: var(--accent); color: #fff; border-radius: 9px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
.bouton.discret { background: var(--surface-2); color: var(--texte); border: 1px solid var(--ligne); }
.lien { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; font-weight: 600; }
.lien:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* ---- etiquettes ---- */
.puce { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.p-vente { background: var(--vert-fond); color: var(--vert); }
.p-vendu { background: var(--rouge-fond); color: var(--rouge); }
.p-ancien { background: var(--surface-2); color: var(--doux); border: 1px solid var(--ligne); }
.p-special { background: var(--bleu-fond); color: var(--bleu); }
.raff { display: inline-block; font-size: 12px; font-weight: 700; color: var(--or); background: var(--or-fond); border-radius: 6px; padding: 0 6px; margin-right: 6px; }
.qte { color: var(--doux); font-weight: 500; margin-left: 4px; }
.affixes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.affixe { font-size: 12px; background: var(--surface-2); border: 1px solid var(--ligne); color: var(--doux); border-radius: 6px; padding: 1px 7px; }
.affixe.carte { color: var(--bleu); }
.affixe.match { background: var(--accent-fond); border-color: transparent; color: var(--accent); font-weight: 600; }
.prix { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.prix small { color: var(--doux); font-weight: 500; margin-left: 2px; }
.meta { color: var(--doux); font-size: 12.5px; }

/* ---- shops actuels ---- */
.grille { columns: 3 320px; column-gap: 14px; }
.shop { break-inside: avoid; background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); box-shadow: var(--ombre); margin-bottom: 14px; overflow: hidden; }
.shop-tete { padding: 12px 14px 10px; border-bottom: 1px solid var(--ligne); }
.shop-tete h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; line-height: 1.3; word-break: break-word; }
.shop ul { list-style: none; margin: 0; padding: 4px 0; }
.shop li { padding: 7px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.shop li + li { border-top: 1px dashed var(--ligne); }
.shop li .meta { grid-column: 1 / -1; }

/* ---- recherche ---- */
.disposition { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .disposition { grid-template-columns: 1fr; } }
.filtres { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 16px; position: sticky; top: 12px; display: grid; gap: 14px; }
.filtres label.titre { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); margin-bottom: 6px; }
.filtres .ligne { display: flex; gap: 8px; }
.filtres .ligne > :first-child { flex: 1; }
.filtres input:not([type]), .filtres select, .filtres input[type=search] { width: 100%; }
.actifs { display: flex; flex-wrap: wrap; gap: 6px; }
.actif-f { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-fond); color: var(--accent); font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 4px 6px 4px 10px; }
.actif-f button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
.bascule { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--texte); }
.resultats { display: grid; gap: 8px; }
.resultat { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; box-shadow: var(--ombre); }
.resultat .bas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.compte { color: var(--doux); font-size: 13px; margin: 0 0 10px; }

/* ---- fiche objet ---- */
.fiche-tete { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.fiche-tete h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tuile { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 12px 14px; box-shadow: var(--ombre); }
.tuile small { color: var(--doux); font-size: 12px; }
.tuile b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.graph { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 14px; height: 340px; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); overflow: hidden; box-shadow: var(--ombre); }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--ligne); text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); font-weight: 600; background: var(--surface-2); }
.vide { color: var(--doux); text-align: center; padding: 48px 20px; background: var(--surface); border: 1px dashed var(--ligne); border-radius: var(--rayon); }
.theme { border: 1px solid var(--ligne); background: var(--surface); border-radius: 9px; padding: 7px 10px; cursor: pointer; color: var(--doux); }

/* ---- mot de passe ---- */
#verrou { position: fixed; inset: 0; background: var(--fond); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#verrou form { background: var(--surface); border: 1px solid var(--ligne); border-radius: 16px; box-shadow: var(--ombre); padding: 28px; width: min(360px, 100%); display: grid; gap: 12px; }
#verrou h2 { margin: 0; font-size: 20px; }
#verrou p { margin: 0; color: var(--doux); font-size: 13.5px; }
#mdp-err { color: var(--rouge); font-size: 13px; min-height: 1em; }

.ico { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; flex: none; }
.ico.grand { width: 36px; height: 36px; margin-right: 10px; }
.nom-objet { display: inline-flex; align-items: center; flex-wrap: wrap; }
.outils { display: flex; gap: 8px; }

.vue { display: none; } .vue.active { display: block; }
.filtres { max-height: calc(100vh - 24px); overflow-y: auto; }
.bloc { display: grid; gap: 8px; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.deux input { width: 100%; }
.segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--ligne); border-radius: 9px; padding: 3px; }
.segment button { border: 0; background: none; padding: 7px 8px; border-radius: 7px; cursor: pointer; color: var(--doux); font-weight: 500; }
.segment button.actif { background: var(--accent); color: #fff; }
.sauvees { display: flex; flex-wrap: wrap; gap: 6px; }
.sauvee { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--ligne); background: var(--surface-2); border-radius: 8px; font-size: 12.5px; }
.sauvee > button:first-child { border: 0; background: none; cursor: pointer; padding: 4px 4px 4px 10px; font-weight: 600; color: var(--texte); }
.sauvee > button.x { border: 0; background: none; cursor: pointer; color: var(--tres-doux); padding: 0 8px 0 2px; font-size: 15px; }
.sauvee.commune { border-color: transparent; background: var(--bleu-fond); }
.sauvee.commune > button:first-child { color: var(--bleu); padding-right: 10px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .bouton { padding: 7px 10px; font-size: 13px; }
.petit { font-size: 12px; color: var(--doux); }
.ligne-objet { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); box-shadow: var(--ombre); }
.ligne-objet .tete-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 18px; align-items: center; padding: 11px 14px; }
.ligne-objet .chiffres-l { display: flex; gap: 18px; align-items: baseline; text-align: right; }
.ligne-objet .chiffres-l div small { display: block; color: var(--doux); font-size: 11.5px; font-weight: 500; }
.ligne-objet .chiffres-l div b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.deplier { border: 1px solid var(--ligne); background: var(--surface-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--doux); white-space: nowrap; }
.annonces-objet { border-top: 1px solid var(--ligne); padding: 6px 14px 10px; display: grid; gap: 6px; }
.annonce { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 6px 0; border-bottom: 1px dashed var(--ligne); }
.annonce:last-child { border-bottom: 0; }
.annonce .bas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.cat { font-size: 11.5px; color: var(--doux); }
.retour { margin-bottom: 14px; }
@media (max-width: 860px) { .filtres { max-height: none; position: static; } .ligne-objet .tete-ligne { grid-template-columns: 1fr; } .ligne-objet .chiffres-l { text-align: left; } }
</style>
</head>
<body>
<div id="verrou"><form id="form-mdp">
  <h2 data-t="titre_html"></h2>
  <p data-t="acces"></p>
  <input id="mdp" type="password" autocomplete="current-password" data-tp="mdp">
  <button class="bouton" data-t="ouvrir"></button><div id="mdp-err"></div>
</form></div>

<div class="page">
  <header>
    <div class="marque"><h1 data-t="titre_html"></h1><p id="entete"></p></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <div class="stats" id="stats"></div>
      <div class="outils"><button class="theme" id="langue" title="Language / Langue"></button><button class="theme" id="theme" data-t="theme"></button></div>
    </div>
  </header>

  <!-- ===================== MARKET (recherche) ===================== -->
  <section class="vue active" id="vue-market">
    <div class="disposition">
      <aside class="filtres">
        <div class="bloc">
          <label class="titre" data-t="sauvees"></label>
          <div class="sauvees" id="sauvees"></div>
          <div class="actions">
            <button class="bouton" id="b-sauver" data-t="sauver"></button>
            <button class="bouton discret" id="b-lien" data-t="copier_lien"></button>
            <button class="bouton discret" id="b-reset" data-t="reset"></button>
          </div>
          <form id="f-sauver" style="display:none" class="ligne"><input id="nom-sauver" data-tp="nom_recherche"><button class="bouton" data-t="ok"></button></form>
          <span class="petit" id="msg-lien"></span>
        </div>
        <div><label class="titre" for="r-nom" data-t="objet"></label><input id="r-nom" type="search" list="noms" data-tp="nom_vide"></div>
        <datalist id="noms"></datalist>
        <div class="bloc"><label class="titre" for="r-groupe" data-t="categorie"></label>
          <select id="r-groupe"></select><select id="r-sous"></select></div>
        <div class="deux">
          <div><label class="titre" for="r-raff" data-t="raff_min"></label><input id="r-raff" type="number" min="0" max="20" value="0"></div>
          <div><label class="titre" data-t="emplacements"></label><select id="r-slots"><option value="">—</option><option value="1">≥ 1</option><option value="2">≥ 2</option><option value="3">≥ 3</option><option value="4">4</option></select></div>
        </div>
        <div><label class="titre" data-t="prix"></label>
          <div class="deux"><input id="r-pmin" data-tp="prix_min"><input id="r-pmax" data-tp="prix_max"></div></div>
        <div class="bloc"><label class="titre" for="r-type" data-t="affixes"></label>
          <select id="r-type"></select>
          <div class="ligne"><input id="r-val" type="number" value="1"><button class="bouton" id="r-ajout" data-t="ajouter"></button></div>
          <div class="actifs" id="r-filtres"></div>
          <span class="petit" data-t="affixes_aide"></span></div>
        <label class="bascule"><input id="r-actuel" type="checkbox" checked> <span data-t="en_vente_seul"></span></label>
        <div class="bloc"><label class="titre" data-t="affichage"></label>
          <div class="segment"><button data-mode="objet" data-t="par_objet"></button><button data-mode="annonce" data-t="par_annonce"></button></div></div>
        <div><label class="titre" for="r-tri" data-t="trier"></label>
          <select id="r-tri"><option value="prix" data-t="tri_prix"></option><option value="prix_desc" data-t="tri_prix_desc"></option><option value="recent" data-t="tri_recent"></option><option value="affixe" data-t="tri_affixe"></option><option value="nom" data-t="tri_nom"></option></select></div>
      </aside>
      <div><p class="compte" id="r-compte"></p><div class="resultats" id="r-res"></div></div>
    </div>
  </section>

  <!-- ===================== FICHE OBJET ===================== -->
  <section class="vue" id="vue-objet">
    <button class="bouton discret retour" id="b-retour" data-t="retour"></button>
    <div id="o-contenu"></div>
  </section>
</div>

<script>
"use strict";
// ---------- traductions (anglais par defaut) ----------
const T = {
  titre_html: ["Prontera <span>Market</span>", "Marché de <span>Prontera</span>"],
  acces: ["Private access. Enter the password.", "Accès réservé. Entre le mot de passe."],
  mdp: ["Password", "Mot de passe"], ouvrir: ["Open", "Ouvrir"], mdp_faux: ["Wrong password.", "Mot de passe incorrect."],
  theme: ["◐ Theme", "◐ Thème"],
  sauvees: ["Saved searches", "Recherches enregistrées"], sauver: ["★ Save", "★ Enregistrer"], copier_lien: ["🔗 Copy link", "🔗 Copier le lien"],
  reset: ["Reset", "Réinitialiser"], nom_recherche: ["Name of this search", "Nom de cette recherche"], ok: ["OK", "OK"],
  aucune_sauvee: ["None yet: set filters, then ★ Save.", "Aucune pour l'instant : règle les filtres puis ★ Enregistrer."],
  lien_copie: ["Link copied: paste it to share this search.", "Lien copié : colle-le pour partager cette recherche."],
  commune: ["Shared with the group", "Commune au groupe"], supprimer: ["Delete", "Supprimer"],
  objet: ["Item", "Objet"], nom_vide: ["Name (empty = all)", "Nom (vide = tous)"],
  categorie: ["Category", "Catégorie"], toutes_cat: ["All categories", "Toutes les catégories"], tous_types: ["All types", "Tous les types"],
  g_arme: ["Weapons", "Armes"], g_armure: ["Armors", "Armures"], g_tete: ["Headgears", "Couvre-chefs"], g_cape: ["Garments", "Capes"],
  g_chaussures: ["Shoes", "Chaussures"], g_bouclier: ["Shields", "Boucliers"], g_accessoire: ["Accessories", "Accessoires"],
  g_carte: ["Cards", "Cartes"], g_costume: ["Costumes", "Costumes"], g_familier: ["Pets & eggs", "Œufs et familiers"],
  g_divers: ["Consumables & materials", "Consommables et matériaux"],
  raff_min: ["Min. refine", "Raffinage min."], emplacements: ["Card slots", "Emplacements"],
  prix: ["Price (e.g. 200k, 1.5m)", "Prix (ex. 200k, 1,5m)"], prix_min: ["min", "min"], prix_max: ["max", "max"],
  affixes: ["Random options", "Affixes"], choisir_type: ["Choose an option type…", "Choisir un type d'affixe…"],
  affixes_aide: ["Only options seen on items of the selected category are listed.", "Seuls les affixes vus sur les objets de la catégorie choisie sont proposés."],
  ajouter: ["Add", "Ajouter"], en_vente_seul: ["Currently for sale only", "En vente actuellement seulement"],
  affichage: ["Display", "Affichage"], par_objet: ["By item", "Par objet"], par_annonce: ["All listings", "Toutes les annonces"],
  trier: ["Sort by", "Trier par"], tri_prix: ["Price ↑", "Prix ↑"], tri_prix_desc: ["Price ↓", "Prix ↓"], tri_recent: ["Most recent", "Plus récent"],
  tri_affixe: ["1st option value ↓", "Valeur du 1er affixe ↓"], tri_nom: ["Name A → Z", "Nom A → Z"],
  retour: ["← Back to search", "← Retour à la recherche"],
  derniere: ["Last run {0} ({1})", "Dernière tournée {0} ({1})"],
  st_shops: ["shops open", "shops en vente"], st_objets: ["items for sale", "objets en vente"],
  st_annonces: ["tracked listings", "annonces suivies"], st_ventes: ["likely sales", "ventes probables"],
  il_y_a_min: ["{0} min ago", "il y a {0} min"], il_y_a_h: ["{0} h ago", "il y a {0} h"], il_y_a_j: ["{0} d ago", "il y a {0} j"],
  en_vente: ["● for sale", "● en vente"], vendu: ["sold?", "vendu ?"], ancienne: ["old listing", "ancienne annonce"],
  ferme: ["shop closed {0}", "shop fermé le {0}"], deconnexion: ["vendor logged out {0}", "vendeur déconnecté le {0}"], absent: ["shop gone {0}", "shop absent le {0}"],
  vu_le: ["seen {0}", "vu le {0}"], vu_du: ["seen {0} → {1}", "vu du {0} au {1}"],

let D = null;
const nombre = n => Math.round(n).toLocaleString(LOCALE());
const z = n => `${nombre(n)}<small>z</small>`;

const date = ts => new Date(ts * 1000).toLocaleString(LOCALE(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

const ilya = ts => { const s = Date.now() / 1000 - ts; return s < 3600 ? t("il_y_a_min", Math.max(1, Math.round(s / 60))) : s < 86400 ? t("il_y_a_h", Math.round(s / 3600)) : t("il_y_a_j", Math.round(s / 86400)); };
const echap = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const infoObjet = id => D.objets[id] || [];

const gabarit = id => (D.options[id] || [])[LANGUE] || ("option " + id);
const texteOption = (id, v) => gabarit(id).replace("%d", v).replace("%%", "%");

const icone = (id, grand) => `<img class="ico${grand ? " grand" : ""}" src="icones/${id}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;

// « 200k », « 1.5m », « 1,5 M », « 1 000 000 » -> nombre
function lirePrix(s) {
  s = String(s || "").trim().toLowerCase().replace(/\s/g, "").replace(",", ".");
  if (!s) return null;
  const m = s.match(/^([0-9.]+)([km]?)/); if (!m) return null;
  return parseFloat(m[1]) * (m[2] === "m" ? 1e6 : m[2] === "k" ? 1e3 : 1);

// ---------- donnees ----------
let OBS = {}, ANN = [], ACTUELS = new Set(), VENDUS = new Set(), PERIODE = {}, DERNIERE_LECTURE = {};
function preparer() {
  for (const [id, aid, ts, titre, x, y, special] of D.observations) {
    OBS[id] = { id, aid, t: ts, titre, special, x, y };
    DERNIERE_LECTURE[aid] = Math.max(DERNIERE_LECTURE[aid] || 0, ts);
  }
  ACTUELS = new Set(D.actuels);
  ANN = D.annonces.map(([obs, objet, prix, q, raff, cartes, options]) => ({ obs: OBS[obs], objet, prix, q, raff, cartes, options,
    sig: JSON.stringify([objet, raff, [...cartes].sort(), options.map(o => o[0] + ":" + o[1]).sort()]) }));
  const parShop = {};
  for (const a of ANN) ((parShop[a.obs.aid] ??= {})[a.obs.id] ??= []).push(a);
  for (const lectures of Object.values(parShop)) {
    const ids = Object.keys(lectures).map(Number).sort((a, b) => OBS[a].t - OBS[b].t);
    for (let i = 0; i + 1 < ids.length; i++) {
      const suivantes = new Set(lectures[ids[i + 1]].map(a => a.sig));
      for (const a of lectures[ids[i]]) if (!suivantes.has(a.sig)) VENDUS.add(a);
    }
  }
  for (const a of ANN) {
    const p = (PERIODE[a.obs.aid + "|" + a.sig] ??= { premier: a.obs.t, dernier: a.obs.t });
    p.premier = Math.min(p.premier, a.obs.t); p.dernier = Math.max(p.dernier, a.obs.t);
  }
}
const periode = a => PERIODE[a.obs.aid + "|" + a.sig];
const vue = a => { const p = periode(a); return p.premier === p.dernier ? t("vu_le", date(p.premier)) : t("vu_du", date(p.premier), date(p.dernier)); };
function disparition(a) {
  if (DERNIERE_LECTURE[a.obs.aid] > a.obs.t) return null;
  return (D.disparitions || []).find(([aid, ts]) => aid === a.obs.aid && ts > a.obs.t) || null;
}
function statut(a) {
  if (ACTUELS.has(a.obs.id)) return `<span class="puce p-vente">${t("en_vente")}</span>`;
  if (VENDUS.has(a)) return `<span class="puce p-vendu">${t("vendu")}</span>`;
  const d = disparition(a);
  if (d) return `<span class="puce p-ancien">${t(d[2] in T ? d[2] : "absent", date(d[1]))}</span>`;
  return `<span class="puce p-ancien">${t("ancienne")}</span>`;
}
const lienObjet = id => `<button class="lien" data-objet="${id}">${echap(nomObjet(id))}</button>`;
const nomComplet = (a, lien = true) => `<span class="nom-objet">${icone(a.objet)}${a.raff ? `<span class="raff">+${a.raff}</span>` : ""}${lien ? lienObjet(a.objet) : `<b>${echap(nomObjet(a.objet))}</b>`}${a.q > 1 ? `<span class="qte">× ${nombre(a.q)}</span>` : ""}</span>`;
function affixes(a, surligner = []) {
  const opts = a.options.map(([id, v]) => `<span class="affixe${surligner.includes(typeOption(id)) ? " match" : ""}">${echap(texteOption(id, v))}</span>`);
  const cartes = a.cartes.filter(c => D.objets[c]).map(c => `<span class="affixe carte">${echap(nomObjet(c))}</span>`);
  return opts.length || cartes.length ? `<div class="affixes">${opts.join("")}${cartes.join("")}</div>` : "";
}

// ---------- etat de la recherche (serialisable : lien partageable et recherches enregistrees) ----------
const ETAT_VIDE = { nom: "", groupe: "", sous: "", raff: 0, slots: "", pmin: "", pmax: "", filtres: [], actuel: true, mode: "objet", tri: "prix" };
let S = JSON.parse(JSON.stringify(ETAT_VIDE));

function ecrireFormulaire() {

const encoder = s => btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/=+$/, "");
const decoder = c => { try { return Object.assign(JSON.parse(JSON.stringify(ETAT_VIDE)), JSON.parse(decodeURIComponent(escape(atob(c))))); } catch (e) { return null; } };

// ---------- listes deroulantes ----------
function annoncesCategorie(groupe, sous) {
  return ANN.filter(a => (!groupe || groupeObjet(a.objet) === groupe) && (!sous || sousType(a.objet) === sous));
}
function remplirCategories() {
  const presents = new Set(ANN.map(a => groupeObjet(a.objet)));
  $("#r-groupe").innerHTML = `<option value="">${t("toutes_cat")}</option>` + GROUPES.filter(g => presents.has(g)).map(g => `<option value="${g}">${t("g_" + g)}</option>`).join("");
}
function remplirSousTypes() {
  const g = $("#r-groupe").value;
  const sous = {};
  if (g) for (const a of ANN) if (groupeObjet(a.objet) === g && sousType(a.objet)) sous[sousType(a.objet)] = libSousType(a.objet);
  const cles = Object.keys(sous).sort((a, b) => sous[a].localeCompare(sous[b], LOCALE()));
  $("#r-sous").innerHTML = `<option value="">${t("tous_types")}</option>` + cles.map(k => `<option value="${echap(k)}">${echap(sous[k])}</option>`).join("");
  $("#r-sous").style.display = cles.length > 1 ? "" : "none";
}
// affixes proposes = types reellement vus sur les objets de la categorie choisie (une armure ne propose pas « degats + »)
function remplirAffixes() {
  const types = {};
  for (const a of annoncesCategorie(S.groupe, S.sous)) for (const [id] of a.options) types[typeOption(id)] = id;
  const tries = Object.keys(types).sort((a, b) => a.localeCompare(b, LOCALE()));
  $("#r-type").innerHTML = `<option value="">${t("choisir_type")}</option>` + tries.map(x => `<option value="${types[x]}">${echap(x)}</option>`).join("");
  // les filtres d'affixes devenus impossibles dans cette categorie sont retires
  S.filtres = S.filtres.filter(f => types[typeOption(f.id)] !== undefined);
}
function afficherFiltres() {
  $("#r-filtres").innerHTML = S.filtres.map((f, i) => `<span class="actif-f">${echap(typeOption(f.id).replace(/[+-]?X/, "≥ " + f.min))}<button data-suppr="${i}">×</button></span>`).join("");
}

// ---------- recherches enregistrees ----------
function sauvees() { try { return JSON.parse(localStorage.getItem("recherches") || "[]"); } catch (e) { return []; } }
function ecrireSauvees(l) { try { localStorage.setItem("recherches", JSON.stringify(l)); } catch (e) {} }
function afficherSauvees() {

  const perso = sauvees().map((r, i) => `<span class="sauvee"><button data-sauvee="${i}">${echap(r.nom)}</button><button class="x" data-suppr-sauvee="${i}" title="${t("supprimer")}">×</button></span>`);

// ---------- recherche ----------
function rechercher() {
  lireFormulaire();
  history.replaceState(null, "", "#r=" + encoder(S));
  const nom = S.nom.toLowerCase(), pmin = lirePrix(S.pmin), pmax = lirePrix(S.pmax), types = S.filtres.map(f => typeOption(f.id));
  const res = ANN.filter(a => (!nom || nomObjet(a.objet).toLowerCase().includes(nom))
    && (!S.groupe || groupeObjet(a.objet) === S.groupe) && (!S.sous || sousType(a.objet) === S.sous)
    && a.raff >= S.raff && (!S.slots || slotsObjet(a.objet) >= +S.slots)
    && (pmin == null || a.prix >= pmin) && (pmax == null || a.prix <= pmax)
    && (!S.actuel || ACTUELS.has(a.obs.id))
    && S.filtres.every((f, i) => a.options.some(([id, v]) => typeOption(id) === types[i] && v >= f.min)));
  // une seule ligne par annonce suivie (meme shop, meme objet) : la lecture la plus recente
  const uniques = {};
  for (const a of res) { const k = a.obs.aid + "|" + a.sig; if (!uniques[k] || uniques[k].obs.t < a.obs.t) uniques[k] = a; }
  const annonces = Object.values(uniques);
  const valAff = a => types.length ? Math.max(...a.options.filter(([id]) => typeOption(id) === types[0]).map(o => o[1])) : 0;
  const triA = { prix: (a, b) => a.prix - b.prix, prix_desc: (a, b) => b.prix - a.prix, recent: (a, b) => b.obs.t - a.obs.t,
                 affixe: (a, b) => valAff(b) - valAff(a) || a.prix - b.prix, nom: (a, b) => nomObjet(a.objet).localeCompare(nomObjet(b.objet), LOCALE()) || a.prix - b.prix }[S.tri];
  annonces.sort((a, b) => (ACTUELS.has(b.obs.id) - ACTUELS.has(a.obs.id)) || triA(a, b));
  const parObjet = {};
  for (const a of annonces) (parObjet[a.objet] ??= []).push(a);
  const nbObjets = Object.keys(parObjet).length;
  $("#r-compte").textContent = t("resultats_objets", nbObjets, annonces.length);
  if (!annonces.length) { $("#r-res").innerHTML = `<div class="vide">${t("aucun_resultat")}</div>`; return; }
  if (S.mode === "annonce") {
    $("#r-res").innerHTML = annonces.slice(0, 200).map(a => carteAnnonce(a, types, true)).join("") + (annonces.length > 200 ? `<p class="compte">${t("premiers")}</p>` : "");
    return;
  }
  // par objet : prix mini, nombre en vente, mediane historique de l'objet
  const histo = {};
  for (const a of ANN) (histo[a.objet] ??= []).push(a.prix);
  const lignes = Object.entries(parObjet).map(([id, l]) => ({ id: +id, l, min: Math.min(...l.map(a => a.prix)), max: Math.max(...l.map(a => a.prix)),
    recent: Math.max(...l.map(a => a.obs.t)), aff: Math.max(...l.map(valAff)), med: mediane(histo[id]) }));
  const triO = { prix: (a, b) => a.min - b.min, prix_desc: (a, b) => b.max - a.max, recent: (a, b) => b.recent - a.recent,
                 affixe: (a, b) => b.aff - a.aff || a.min - b.min, nom: (a, b) => nomObjet(a.id).localeCompare(nomObjet(b.id), LOCALE()) }[S.tri];
  lignes.sort(triO);
  $("#r-res").innerHTML = lignes.slice(0, 200).map(o => {
    const enVente = o.l.filter(a => ACTUELS.has(a.obs.id)).length, ouvert = deplies.has(o.id);
    return `<div class="ligne-objet"><div class="tete-ligne">
        <div><span class="nom-objet">${icone(o.id)}${lienObjet(o.id)}</span><div class="cat">${echap(libSousType(o.id) || t("g_" + groupeObjet(o.id)))}</div></div>
        <div class="chiffres-l">
          <div><small>${S.actuel ? t("en_vente_n") : t("vus_n")}</small><b>${S.actuel ? enVente : o.l.length}</b></div>
          <div><small>${t("moins_cher")}</small><b>${z(o.min)}</b></div>
          <div><small>${t("mediane")}</small><b>${court(o.med)}</b></div></div>
        <button class="deplier" data-deplier="${o.id}">${ouvert ? t("masquer") : t("voir", o.l.length)}</button></div>
      ${ouvert ? `<div class="annonces-objet">${o.l.map(a => carteAnnonce(a, types, false)).join("")}</div>` : ""}</div>`;
  }).join("") + (lignes.length > 200 ? `<p class="compte">${t("premiers")}</p>` : "");
}
function carteAnnonce(a, types, complet) {
  const corps = `<div>${complet ? nomComplet(a) : `<span class="nom-objet">${a.raff ? `<span class="raff">+${a.raff}</span>` : ""}${a.q > 1 ? `<span class="qte">× ${nombre(a.q)}</span>` : ""}</span>`}${affixes(a, types)}</div>
    <div class="prix">${z(a.prix)}</div>
    <div class="bas">${statut(a)}<span class="meta">${echap(a.obs.titre)}</span><span class="meta">${vue(a)}</span></div>`;

  const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();

      { type: "line", label: t("g_mediane"), data: jours.map(j => parJour[j].prix.length ? mediane(parJour[j].prix) : null), borderColor: c("--bleu"), backgroundColor: c("--bleu"), borderDash: [6, 4], yAxisID: "y", spanGaps: true, tension: .25, pointRadius: 3, borderWidth: 2 },
      { type: "bar", label: t("g_annonces"), data: jours.map(j => parJour[j].annonces), backgroundColor: c("--ligne"), borderRadius: 4, yAxisID: "v", maxBarThickness: 28 },
      { type: "bar", label: t("g_ventes"), data: jours.map(j => parJour[j].ventes), backgroundColor: c("--vert"), borderRadius: 4, yAxisID: "v", maxBarThickness: 28 } ] },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { color: c("--doux"), usePointStyle: true, boxWidth: 8 } },
        tooltip: { callbacks: { label: x => " " + x.dataset.label + " : " + (x.dataset.yAxisID === "y" ? nombre(x.raw) + " z" : x.raw) } } },
      scales: { x: { ticks: { color: c("--doux") }, grid: { display: false } },
        y: { position: "left", ticks: { color: c("--doux"), callback: v => court(v) }, grid: { color: c("--ligne") }, border: { display: false } },
        v: { position: "right", beginAtZero: true, ticks: { color: c("--tres-doux"), precision: 0 }, grid: { display: false }, border: { display: false } } } } });
}

// ---------- en-tete ----------
function entete() {
  const enVente = ANN.filter(a => ACTUELS.has(a.obs.id)).length;
  $("#entete").textContent = t("derniere", ilya(D.derniere_tournee), date(D.derniere_tournee));
  $("#stats").innerHTML = [[D.actuels.length, "st_shops"], [enVente, "st_objets"], [ANN.length, "st_annonces"], [D.ventes.length, "st_ventes"]]
    .map(([n, l]) => `<div class="stat"><b>${nombre(n)}</b><small>${t(l)}</small></div>`).join("");
  $("#noms").innerHTML = [...new Set(ANN.map(a => nomObjet(a.objet)))].sort((a, b) => a.localeCompare(b, LOCALE())).map(n => `<option value="${echap(n)}">`).join("");
}

// ---------- evenements ----------
document.body.addEventListener("click", e => {
  const o = e.target.closest("[data-objet]"); if (o) { ficheObjet(+o.dataset.objet); return; }
  const d = e.target.closest("[data-deplier]"); if (d) { const id = +d.dataset.deplier; deplies.has(id) ? deplies.delete(id) : deplies.add(id); rechercher(); return; }
  const c = e.target.closest("[data-commune]"); if (c) { chargerRecherche(D.recherches_communes[+c.dataset.commune].s); return; }
  const s = e.target.closest("[data-sauvee]"); if (s) { chargerRecherche(sauvees()[+s.dataset.sauvee].s); return; }
  const x = e.target.closest("[data-suppr-sauvee]"); if (x) { const l = sauvees(); l.splice(+x.dataset.supprSauvee, 1); ecrireSauvees(l); afficherSauvees(); return; }
  const m = e.target.closest("[data-mode]"); if (m) { S.mode = m.dataset.mode; document.querySelectorAll(".segment button").forEach(b => b.classList.toggle("actif", b === m)); rechercher(); return; }
});
["#r-nom", "#r-raff", "#r-pmin", "#r-pmax"].forEach(s => $(s).addEventListener("input", rechercher));
["#r-slots", "#r-actuel", "#r-tri", "#r-sous"].forEach(s => $(s).addEventListener("change", () => { lireFormulaire(); remplirAffixes(); afficherFiltres(); rechercher(); }));
$("#r-groupe").addEventListener("change", () => { $("#r-sous").value = ""; remplirSousTypes(); lireFormulaire(); remplirAffixes(); afficherFiltres(); rechercher(); });
$("#r-ajout").onclick = () => { const id = +$("#r-type").value; if (!id) return; S.filtres.push({ id, min: +$("#r-val").value || 0 }); $("#r-type").value = ""; if (S.tri === "prix") $("#r-tri").value = "affixe"; afficherFiltres(); rechercher(); };
$("#r-filtres").onclick = e => { const i = e.target.dataset.suppr; if (i != null) { S.filtres.splice(+i, 1); afficherFiltres(); rechercher(); } };
$("#b-sauver").onclick = () => { $("#f-sauver").style.display = "flex"; $("#nom-sauver").value = S.nom || ""; $("#nom-sauver").focus(); };
$("#f-sauver").onsubmit = e => { e.preventDefault(); const n = $("#nom-sauver").value.trim(); if (!n) return; lireFormulaire();
  const l = sauvees().filter(r => r.nom !== n); l.push({ nom: n, s: JSON.parse(JSON.stringify(S)) }); ecrireSauvees(l); $("#f-sauver").style.display = "none"; afficherSauvees(); };
$("#b-lien").onclick = async () => { lireFormulaire(); const lien = location.origin + location.pathname + (LANGUE ? "?lang=fr" : "") + "#r=" + encoder(S);
  try { await navigator.clipboard.writeText(lien); $("#msg-lien").textContent = t("lien_copie"); } catch (e) { $("#msg-lien").textContent = lien; } };
$("#b-reset").onclick = () => chargerRecherche(ETAT_VIDE);
$("#b-retour").onclick = () => { montrer("market"); rechercher(); };
function appliquerTheme(th) { if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; }
try { appliquerTheme(localStorage.getItem("theme")); } catch (e) {}
$("#theme").onclick = () => {
  const sombre = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const th = sombre ? "light" : "dark"; appliquerTheme(th); try { localStorage.setItem("theme", th); } catch (e) {}
  if (objetCourant && $("#vue-objet").classList.contains("active")) ficheObjet(objetCourant);
};
function toutAfficher() {
  traduirePage(); if (!D) return;
  entete(); afficherSauvees(); ecrireFormulaire();
  if ($("#vue-objet").classList.contains("active") && objetCourant) ficheObjet(objetCourant); else rechercher();
}
$("#langue").onclick = () => { LANGUE = 1 - LANGUE; try { localStorage.setItem("langue", LANGUE ? "fr" : "en"); } catch (e) {} toutAfficher(); };
function suivreLien() {
  const h = location.hash.slice(1);
  if (h.startsWith("objet=")) { ficheObjet(+h.slice(6)); return; }
  if (h.startsWith("r=")) { const s = decoder(h.slice(2)); if (s) { S = s; ecrireFormulaire(); } }
  montrer("market"); rechercher();
}

// ---------- chargement (en clair en local, chiffre une fois publie) ----------
async function dechiffrer(paquet, mdp) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const cle = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(paquet.sel), iterations: paquet.iterations, hash: "SHA-256" },
    await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]),
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(paquet.iv) }, cle, b(paquet.donnees))));
}
function demarrer(donnees) { D = donnees; preparer(); traduirePage(); entete(); afficherSauvees(); ecrireFormulaire(); suivreLien(); }
traduirePage(); $("#entete").textContent = t("chargement");
(async () => {
  const r = await fetch("donnees/market.json", { cache: "no-store" });
  if (!r.ok) { $("#entete").textContent = t("donnees_absentes"); return; }
  const paquet = await r.json();
  if (!paquet.chiffre) { demarrer(paquet); return; }
  $("#verrou").style.display = "flex";
  const essayer = async mdp => { try { demarrer(await dechiffrer(paquet, mdp)); $("#verrou").style.display = "none"; try { sessionStorage.setItem("mdp", mdp); } catch (e) {} return true; } catch (e) { return false; } };
  let m = null; try { m = sessionStorage.getItem("mdp"); } catch (e) {}
  if (m && await essayer(m)) return;
  $("#form-mdp").onsubmit = async e => { e.preventDefault(); $("#mdp-err").textContent = "";
    if (!await essayer($("#mdp").value)) $("#mdp-err").textContent = t("mdp_faux"); };
  $("#mdp").focus();
})();
</script>
